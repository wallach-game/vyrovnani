<style>
:root{--bg:#f6f5f2;--surface:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e3e1dc;--err:#9b2c2c;--accent:#1d1d1b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161615;--surface:#201f1d;--ink:#ecebe7;--muted:#a3a19b;--line:#34322f;--err:#e07a7a;--accent:#ecebe7}}
:root[data-theme="dark"]{--bg:#161615;--surface:#201f1d;--ink:#ecebe7;--muted:#a3a19b;--line:#34322f;--err:#e07a7a;--accent:#ecebe7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:420px}
h1{font-size:20px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 16px;font-size:14px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label.rem{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--muted)}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:1.2em}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const SKEY = 'vyrovnani-unlock';
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f=document.getElementById('f'), err=document.getElementById('err'), go=document.getElementById('go');
f.addEventListener('submit', async e=>{
  e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Dešifruji…';
  const pw=document.getElementById('pw').value;
  try{
    const html=await unlock(pw);
    if(document.getElementById('rem').checked){ try{ sessionStorage.setItem(SKEY,pw); }catch(_){} }
    show(html);
  }catch(_){
    err.textContent='Špatné heslo.'; go.disabled=false; go.textContent='Odemknout';
  }
});
(async()=>{ let pw=null; try{ pw=sessionStorage.getItem(SKEY); }catch(_){}
  if(pw){ try{ show(await unlock(pw)); }catch(_){ try{ sessionStorage.removeItem(SKEY); }catch(__){} } } })();
</script>
